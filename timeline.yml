# Context events for timeline slides — events with no dedicated slide.
#
# The whole course's background events live here in one place instead of being
# scattered across slides; each timeline slide opts in by group name:
#
#   ---
#   layout: timeline
#   useGroups: [revolution]
#   ---
#
# An entry may belong to several groups (group: [revolution, empire]) and then
# appears once even when both groups are selected. Artwork slides carry their
# own `timeline:` frontmatter and are unaffected by this file.

